name: Analyze

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect Swift changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            swift:
              - Package.swift
              - Sources/**
              - Tests/**
              - Taskfile.yml
              - .swiftlint.yml
              - mise.toml
              - mise.lock
              - .github/workflows/analyze.yaml

  analyze:
    name: Analyze
    needs: changes
    # Pushes to main always build; pull requests only when Swift-related files changed.
    # A skipped job satisfies a required status check.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.swift == 'true') }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4

      - run: task analyze
