name: Release

# Releases are immutable once published, so the app is built, signed, and attached
# to the draft first, and the draft is published as the last step.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release to publish (default: the single existing draft)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build-app.sh derives the build number from the commit count.
          fetch-depth: 0
          persist-credentials: false

      - id: draft
        run: sh .github/scripts/find-draft.sh "$GITHUB_REPOSITORY" "$INPUT_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}

      - name: Import signing identity
        run: sh .github/scripts/import-identity.sh "Sokki Development"
        env:
          SOKKI_SIGNING_P12_BASE64: ${{ secrets.SOKKI_SIGNING_P12_BASE64 }}
          SOKKI_SIGNING_P12_PASSWORD: ${{ secrets.SOKKI_SIGNING_P12_PASSWORD }}

      - run: sh scripts/build-app.sh "Sokki Development"
        env:
          VERSION: ${{ steps.draft.outputs.tag }}

      - run: codesign --verify --strict --deep build/Sokki.app

      - name: Notarize
        run: sh .github/scripts/notarize.sh build/Sokki.app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - run: ditto -c -k --keepParent build/Sokki.app "Sokki-$TAG.zip"
        env:
          TAG: ${{ steps.draft.outputs.tag }}

      - run: shasum -a 256 "Sokki-$TAG.zip" > "Sokki-$TAG.zip.sha256"
        env:
          TAG: ${{ steps.draft.outputs.tag }}

      - run: gh release upload "$TAG" "Sokki-$TAG.zip" "Sokki-$TAG.zip.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.draft.outputs.tag }}

      # Publishing creates the tag at the commit that was just built.
      - run: gh release edit "$TAG" --draft=false --latest --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.draft.outputs.tag }}
