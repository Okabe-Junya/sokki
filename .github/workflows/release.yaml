name: Release

# Releases are immutable once published, so the app is built, signed, and attached
# to the draft first, and the draft is published as the last step.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release to publish (default: the single existing draft)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build-app.sh derives the build number from the commit count.
          fetch-depth: 0
          persist-credentials: false

      - id: draft
        run: sh .github/scripts/find-draft.sh "$GITHUB_REPOSITORY" "$INPUT_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}

      - name: Import signing identity
        run: sh .github/scripts/import-identity.sh "Developer ID Application"
        env:
          SOKKI_SIGNING_P12_BASE64: ${{ secrets.SOKKI_SIGNING_P12_BASE64 }}
          SOKKI_SIGNING_P12_PASSWORD: ${{ secrets.SOKKI_SIGNING_P12_PASSWORD }}

      - run: sh scripts/build-app.sh "Developer ID Application"
        env:
          VERSION: ${{ steps.draft.outputs.tag }}

      - run: codesign --verify --strict --deep build/Sokki.app

      - name: Notarize
        run: sh .github/scripts/notarize.sh build/Sokki.app
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      - run: spctl --assess --type execute --verbose build/Sokki.app

      # The image keeps one name across releases so that
      # releases/latest/download/Sokki.dmg always points at the newest one.
      - run: sh scripts/make-dmg.sh build/Sokki.app Sokki.dmg "Developer ID Application"

      - name: Notarize the disk image
        run: sh .github/scripts/notarize.sh Sokki.dmg
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      - run: spctl --assess --type open --context context:primary-signature --verbose Sokki.dmg

      - run: shasum -a 256 Sokki.dmg > Sokki.dmg.sha256

      - run: gh release upload "$TAG" Sokki.dmg Sokki.dmg.sha256 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.draft.outputs.tag }}

      # Publishing creates the tag at the commit that was just built.
      - run: gh release edit "$TAG" --draft=false --latest --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.draft.outputs.tag }}
