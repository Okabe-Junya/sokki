name: Lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    # Hosted runner minutes are billed on private repositories.
    if: ${{ !github.event.repository.private }}
    # Formatting and lint rules are syntax-only, so they run on Linux and leave the
    # macOS runner pool (5 concurrent jobs) to the builds.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    # swift-format ships with the toolchain; 6.3 matches the Swift in Xcode 26.6 on macos-26.
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4

      - run: task lint
