name: Labeler

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  label:
    # Hosted runner minutes are billed on private repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Reads the config from the base branch over the API; no checkout of PR code.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yaml
          sync-labels: true
