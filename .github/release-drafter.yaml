# Release notes are drafted from merged PRs; publishing the draft runs release.yaml.
# The next version comes from the bump:* label on each merged PR (default patch).
name-template: v$RESOLVED_VERSION
tag-template: v$RESOLVED_VERSION

categories:
  - title: Features
    when:
      label: feature
  - title: Bug Fixes
    when:
      label: fix
  - title: Performance
    when:
      label: perf
  - title: Refactoring
    when:
      label: refactor
  - title: Documentation
    when:
      label: docs
  - title: Tests
    when:
      label: test
  - title: Dependencies
    when:
      label: dependencies
  - title: Maintenance
    when:
      label: chore
  - title: Other Changes
  # Version resolution only; the highest matching increment wins, patch is the fallback.
  - type: version-resolver
    semver-increment: major
    when:
      label: "bump:major"
  - type: version-resolver
    semver-increment: minor
    when:
      label: "bump:minor"
  - type: version-resolver
    semver-increment: patch
    when:
      label: "bump:patch"
  - type: version-resolver
    semver-increment: patch

change-template: "- $TITLE (#$NUMBER)"
change-title-escapes: '\<*_&'

# Type labels share their names with the branch types (Okabe-Junya/<type>/...)
# and also match a Conventional Commit title. A `!:` title or a breaking-change
# footer line wins as major; swap the bump:* label on the PR to override before merge.
autolabeler:
  - label: "bump:major"
    title: ['/^\w+(\(.+\))?!:/']
    body: ["/^BREAKING[- ]CHANGE: /m"]
  - label: "bump:minor"
    branch: ['/\/feature\//']
    title: ['/^feat(\(.+\))?:/']
  - label: "bump:patch"
    branch: ['/\/(fix|docs|refactor|perf|test|chore)\//', '/^renovate\//']
    title: ['/^(fix|docs|refactor|perf|test|chore)(\(.+\))?:/']
  - label: feature
    branch: ['/\/feature\//']
    title: ['/^feat(\(.+\))?:/']
  - label: fix
    branch: ['/\/fix\//']
    title: ['/^fix(\(.+\))?:/']
  - label: perf
    branch: ['/\/perf\//']
    title: ['/^perf(\(.+\))?:/']
  - label: refactor
    branch: ['/\/refactor\//']
    title: ['/^refactor(\(.+\))?:/']
  - label: docs
    branch: ['/\/docs\//']
    title: ['/^docs(\(.+\))?:/']
  - label: test
    branch: ['/\/test\//']
    title: ['/^test(\(.+\))?:/']
  - label: chore
    branch: ['/\/chore\//']
    title: ['/^chore(\(.+\))?:/']

template: |
  ## What's Changed

  $CHANGES

  ## Install

  Download `Sokki-v$RESOLVED_VERSION.zip` below, unzip it, move Sokki.app to /Applications, and follow the first-launch steps in the README.

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
